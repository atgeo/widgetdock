<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&display=swap" rel="stylesheet">
    <link rel="icon" href="/icons/favicon.png" type="image/png">
    <link rel="stylesheet" href="/css/quiz.css"/>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
<div x-data="quizWidget()" class="quiz space-y-6">
    <template x-for="(item, idx) in quiz" :key="idx">
        <div class="p-4 rounded-2xl border border-gray-200 bg-white shadow-sm space-y-4">
            <p class="text-lg font-semibold text-gray-800">
                Word: <span x-text="item.word"></span>
            </p>

            <button
                    @click="playPhonetic(item.word)"
                    class="ml-2 text-blue-600 hover:text-blue-800 text-xl"
                    title="Play pronunciation"
            >
                🔊
            </button>

            <!-- Options -->
            <div class="space-y-3">
                <template x-for="(opt, i) in item.options" :key="i">
                    <button
                            @click="checkAnswer(idx, i)"
                            x-text="opt"
                            class="w-full py-3 px-4 rounded-xl text-left border transition-all duration-150
                               bg-gray-50 border-gray-300 text-gray-800
                               hover:bg-gray-100 active:bg-gray-200 active:scale-[0.98]"
                            :class="{
                            'bg-green-500 text-white border-green-600': item.feedbackType === 'correct' && item.correctIndex === i,
                            'bg-red-500 text-white border-red-600': item.feedbackType === 'wrong' && item.selectedIndex === i
                        }"
                    ></button>
                </template>
            </div>

            <p
                    class="font-medium"
                    :class="{
                    'text-green-600': item.feedbackType === 'correct',
                    'text-red-600': item.feedbackType === 'wrong'
                    }"
                    x-text="item.feedback">
            </p>
        </div>
    </template>
</div>
<script src="/js/quiz.js"></script>
</body>
</html>
